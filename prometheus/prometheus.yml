global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "kackplaner_backend"
    static_configs:
      - targets: ["localhost:3000"]
  
  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]
  
  - job_name: "systemd_exporter"
    static_configs:
      - targets: ["localhost:9558"]