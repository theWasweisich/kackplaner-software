server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/tmp/positions.yml

clients:
  - url: http://localhost:3100/loki/api/v1/push


scrape_configs:
  - job_name: systemd-journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level: level
