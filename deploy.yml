---
- name: Deploy Kackplaner
  hosts: kiosk
  become: true

  vars_files:
    - secrets.yml

  vars:
    app_name: "kackplaner"
    app_user: "user"
    base_dest: "/opt/{{ app_name }}"
    master_db_path: "{{ base_dest }}/data/database.db"
    master_env: "/opt/{{ app_name }}.env"
    backend_port: 8090

    active_services:
      - "{{ app_name }}-external.service"
      - "{{ app_name }}-backend.service"
      - "{{ app_name }}-frontend.service"
      - "{{ app_name }}-telegram-bot.service"
      - "{{ app_name }}-kiosk-supervisor.service"
      - "{{ app_name }}-alert.timer"
      - "{{ app_name }}-alert-temp.timer"

    systemd_units: "{{ active_services + [app_name + '-alert.service', app_name + '-alert-temp.service'] }}"

    restart_triggers:
      external:
        - "{{ app_name }}-external.service"
      backend:
        - "{{ app_name }}-backend.service"
      frontend:
        - "{{ app_name }}-frontend.service"
      notifier:
        - "{{ app_name }}-telegram-bot.service"
      kiosk_scripts:
        - "{{ app_name }}-kiosk-supervisor.service"
      prometheus:
        - "prometheus.service"
      grafana:
        - "grafana-server.service"
      promtail:
        - "promtail.service"

  tasks:
    - name: Prerequisites and Setup Group
      block:
        - name: Generate master .env file
          ansible.builtin.template:
            src: "{{ playbook_dir }}/templates/kackplaner.env.j2"
            dest: "{{ master_env }}"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: "0644"

        - name: Resolve NVM path for {{ app_user }}
          ansible.builtin.shell: "source ~/.nvm/nvm.sh && nvm which current"
          args:
            executable: /bin/bash
          become_user: "{{ app_user }}"
          register: nvm_which
          changed_when: false

        - name: Extract NVM binary directory
          ansible.builtin.set_fact:
            nvm_bin_dir: "{{ nvm_which.stdout | dirname }}"

        - name: Set up persistent data directory
          ansible.builtin.file:
            path: "{{ base_dest }}/data"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: "0755"

    - name: External Deployment Group
      block:
        - name: Local Build - Compile TypeScript
          delegate_to: localhost
          become: false
          ansible.builtin.shell: "source ~/.nvm/nvm.sh && npm install && npx tsc"
          args:
            executable: /bin/bash
            chdir: "{{ playbook_dir }}/external"
          # noqa: no-changed-when

        - name: Push external to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/external/"
            dest: "{{ base_dest }}/external/"
            delete: true
            owner: false
            group: false
            checksum: true
            rsync_opts:
              - "--exclude=node_modules"
          register: external_sync
          notify: "Restart External"

        - name: Pi Build - Install ARM-compatible Node modules
          when: external_sync.changed
          ansible.builtin.command: npm install
          args:
            chdir: "{{ base_dest }}/external"
          environment:
            PATH: "{{ nvm_bin_dir }}:/usr/bin:/bin"
          become_user: "{{ app_user }}"
          # noqa: no-changed-when no-handler

        - name: Fix ownership
          when: external_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/external"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

    - name: Backend Deployment Group
      block:
        - name: Local Build - Compile TypeScript
          delegate_to: localhost
          become: false
          ansible.builtin.shell: "source ~/.nvm/nvm.sh && npm install && npx tsc"
          args:
            executable: /bin/bash
            chdir: "{{ playbook_dir }}/backend"
          # noqa: no-changed-when

        - name: Push backend to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/backend/"
            dest: "{{ base_dest }}/backend/"
            delete: true
            owner: false
            group: false
            checksum: true
            rsync_opts:
              - "--exclude=node_modules"
          register: backend_sync
          notify: "Restart Backend"

        - name: Pi Build - Install ARM-compatible Node modules
          when: backend_sync.changed
          ansible.builtin.command: npm install
          args:
            chdir: "{{ base_dest }}/backend"
          environment:
            PATH: "{{ nvm_bin_dir }}:/usr/bin:/bin"
          become_user: "{{ app_user }}"
          # noqa: no-changed-when no-handler

        - name: Fix ownership
          when: backend_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/backend"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

    - name: Notifier Deployment Group
      block:
        - name: Sync notifier files directly to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/notifier/"
            dest: "{{ base_dest }}/notifier/"
            delete: true
            owner: false
            group: false
            checksum: true
            rsync_opts:
              - "--exclude=.venv"
              - "--exclude=.idea"
              - "--exclude=.mypy_cache"
              - "--exclude=.env"
              - "--exclude=chat_ids.whitelist"
              - "--exclude=__pycache__"
          register: notifier_sync
          notify: "Restart Notifier"

        - name: Fix ownership
          when: notifier_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/notifier"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

        - name: Create venv and install packages
          when: notifier_sync.changed
          ansible.builtin.pip:
            requirements: "{{ base_dest }}/notifier/requirements.txt"
            virtualenv: "{{ base_dest }}/notifier/.venv"
            virtualenv_command: /usr/bin/python3 -m venv
          # noqa: no-handler

        - name: Make alert scripts executable
          when: notifier_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/notifier/{{ item }}"
            mode: "0755"
          loop:
            - notify.py
            - temp.notify.py
          failed_when: false
          # noqa: no-handler

    - name: Kiosk Scripts Deployment Group
      block:
        - name: Sync kiosk scripts to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/kiosk-scripts/"
            dest: "{{ base_dest }}/kiosk-scripts/"
            delete: true
            owner: false
            group: false
            checksum: true
          register: kiosk_scripts_sync
          notify: "Restart Kiosk Scripts"

        - name: Make scripts executable and fix ownership
          when: kiosk_scripts_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/kiosk-scripts"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

    - name: Frontend Deployment Group
      block:
        - name: Local Build - Compile Frontend
          delegate_to: localhost
          become: false
          ansible.builtin.shell: "source ~/.nvm/nvm.sh && npm install && npm run build"
          args:
            executable: /bin/bash
            chdir: "{{ playbook_dir }}/frontend"
          environment:
            VITE_BACKEND_PORT: "{{ backend_port }}"
          # noqa: no-changed-when

        - name: Ensure final dist directory exists on Pi
          ansible.builtin.file:
            path: "{{ base_dest }}/frontend/dist"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: "0755"

        - name: Push compiled dist to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/frontend/dist/"
            dest: "{{ base_dest }}/frontend/dist/"
            delete: true
            owner: false
            group: false
            checksum: true
          register: frontend_sync
          notify: "Restart Frontend"

        - name: Fix ownership of final dist
          when: frontend_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/frontend/dist"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

    - name: "Prometheus Deployment Group"
      block:
        - name: Install Prometheus
          ansible.builtin.apt:
            name: prometheus
            state: present
            update_cache: true

        - name: Push Prometheus configuration
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/prometheus/prometheus.yml"
            dest: "/etc/prometheus/prometheus.yml"
            owner: prometheus
            group: prometheus
            mode: "0644"
          register: prometheus_sync
          notify: "Restart Prometheus"

    - name: Grafana Deployment Group
      block:
        - name: Ensure keyrings directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Add Grafana GPG key
          ansible.builtin.get_url:
            url: https://apt.grafana.com/gpg.key
            dest: /etc/apt/keyrings/grafana.key
            mode: '0644'

        - name: Add Grafana repository
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/grafana.key] https://apt.grafana.com stable main"
            state: present
            update_cache: true

        - name: Install Grafana via APT
          ansible.builtin.apt:
            name: grafana
            state: present

        - name: Push Grafana configuration override
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/grafana/grafana.ini"
            dest: "/etc/grafana/grafana.ini"
            owner: grafana
            group: grafana
            mode: "0644"
          register: grafana_sync
          notify: "Restart Grafana"

        - name: Push Grafana provisioning files
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/grafana/provisioning/"
            dest: "/etc/grafana/provisioning/"
            delete: true
            owner: false
            group: false
            checksum: true
          register: grafana_provisioning_sync
          notify: "Restart Grafana"

    - name: Loki and Promtail Deployment Group
      block:
        - name: Install Loki and Promtail via APT
          ansible.builtin.apt:
            name:
              - loki
              - promtail
            state: present
        
        - name: Ensure promtail group exists
          ansible.builtin.group:
            name: promtail
            system: true

        - name: Add promtail user to systemd-journal group
          ansible.builtin.user:
            name: promtail
            groups: systemd-journal
            append: true

        - name: Push Promtail configuration
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/promtail/promtail-config.yaml"
            dest: "/etc/promtail/config.yml"
            owner: promtail
            group: promtail
            mode: "0644"
          register: promtail_sync
          notify: "Restart Promtail"

    - name: Systemd Services and Startup Group
      block:
        - name: Copy systemd units individually
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/services/{{ item }}"
            dest: "{{ base_dest }}/services/{{ item }}"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: "0644"
          loop: "{{ systemd_units }}"
          register: service_files_sync

        - name: Link updated units into systemd
          ansible.builtin.command: systemctl link {{ base_dest }}/services/{{ item.item }}
          loop: "{{ service_files_sync.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.changed
          register: link_result
          changed_when: "'Created symlink' in link_result.stdout"
          # noqa: command-instead-of-module no-handler

        - name: Reload systemd daemon if units changed
          ansible.builtin.systemd:
            daemon_reload: true
          when: service_files_sync.changed
          # noqa: no-handler

        - name: Restart External daemons if source code changed
          ansible.builtin.command: "systemctl restart {{ restart_triggers.external | join(' ') }}"
          when: external_sync.changed
          # noqa: no-handler

        - name: Restart Backend daemons if source code changed
          ansible.builtin.command: "systemctl restart {{ restart_triggers.backend | join(' ') }}"
          when: backend_sync.changed
          # noqa: no-handler

        - name: Restart Frontend daemons if source code changed
          ansible.builtin.command: "systemctl restart {{ restart_triggers.frontend | join(' ') }}"
          when: frontend_sync.changed
          # noqa: no-handler

        - name: Restart Notifier daemons if source code changed
          ansible.builtin.command: "systemctl restart {{ restart_triggers.notifier | join(' ') }}"
          when: notifier_sync.changed
          # noqa: no-handler

        - name: Restart Kiosk Supervisor
          ansible.builtin.command: "systemctl restart {{ restart_triggers.kiosk_scripts | join(' ') }}"
          when: kiosk_scripts_sync.changed
          # noqa: no-handler

        - name: Restart Prometheus
          ansible.builtin.command: "systemctl restart {{ restart_triggers.prometheus | join(' ') }}"
          when: prometheus_sync.changed
          # noqa: no-handler

        - name: Restart Grafana
          ansible.builtin.command: "systemctl restart {{ restart_triggers.grafana | join(' ') }}"
          when: grafana_sync.changed or grafana_provisioning_sync.changed

        - name: Restart Promtail
          ansible.builtin.command: "systemctl restart {{ restart_triggers.promtail | join(' ') }}"
          when: promtail_sync.changed
          # noqa: command-instead-of-module no-handler

        - name: Restart any service whose unit file changed
          ansible.builtin.systemd:
            name: "{{ item.item }}"
            state: restarted
          loop: "{{ service_files_sync.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.changed and item.item in active_services
          # noqa: no-handler

        - name: Ensure all services are enabled
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: started
            enabled: true
          loop: "{{ active_services }}"

  handlers:
    - name: "Restart External"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ restart_triggers.external }}"
      ignore_errors: true