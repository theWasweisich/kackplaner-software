---
- name: Deploy Kackplaner
  hosts: kiosk
  become: yes # Run as root

  vars:
    app_name: "kackplaner"
    app_user: "user"
    base_dest: "/opt/{{ app_name }}"
    master_env: "/opt/{{ app_name }}.env"

    restart_triggers:
      external:
        - "{{ app_name }}-external.service"
      backend:
        - "{{ app_name }}-backend.service"
      frontend:
        - "{{ app_name }}-frontend.service"
      notifier:
        - "{{ app_name }}-telegram-bot.service"

    active_services:
      - "{{ app_name }}-external.service"
      - "{{ app_name }}-backend.service"
      - "{{ app_name }}-frontend.service"
      - "{{ app_name }}-telegram-bot.service"
      - "{{ app_name }}-kiosk-supervisor.service"
      - "{{ app_name }}-alert.timer"
      - "{{ app_name }}-alert-temp.timer"

    systemd_units: "{{ active_services + [app_name + '-alert.service', app_name + '-alert-temp.service'] }}"

  tasks:
    - name: Prerequisites and Setup Group
      block:
        - name: Verify master config exists
          stat:
            path: "{{ master_env }}"
          register: master_env_stat
          failed_when: not master_env_stat.stat.exists

        - name: Resolve NVM path for {{ app_user }}
          shell: "source ~/.nvm/nvm.sh && nvm which current"
          args:
            executable: /bin/bash
          become_user: "{{ app_user }}"
          register: nvm_which
          changed_when: false

        - name: Extract NVM binary directory
          set_fact:
            nvm_bin_dir: "{{ nvm_which.stdout | dirname }}"

        - name: Set up persistent data directory
          file:
            path: "{{ base_dest }}/data"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_user }}"

    - name: External Deployment Group
      block:
        - name: Local Build - Compile TypeScript (Fast incremental build)
          delegate_to: localhost
          become: no
          shell: "source ~/.nvm/nvm.sh && npm install && npx tsc"
          args:
            executable: /bin/bash
            chdir: "{{ playbook_dir }}/external"

        - name: Push external to Pi (Acts as our change detector)
          synchronize:
            src: "{{ playbook_dir }}/external/"
            dest: "{{ base_dest }}/external/"
            delete: yes
            owner: no
            group: no
            rsync_opts:
              - "--exclude=node_modules"
          register: external_sync

        - name: Pi Build - Install ARM-compatible Node modules
          when: external_sync.changed
          shell: "npm install"
          args:
            chdir: "{{ base_dest }}/external"
          environment:
            PATH: "{{ nvm_bin_dir }}:/usr/bin:/bin"
          become_user: "{{ app_user }}"

        - name: Fix ownership
          when: external_sync.changed
          file:
            path: "{{ base_dest }}/external"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: yes

    - name: Backend Deployment Group
      block:
        - name: Local Build
          delegate_to: localhost
          become: no
          shell: "source ~/.nvm/nvm.sh && npm install && npx tsc"
          args:
            executable: /bin/bash
            chdir: "{{ playbook_dir }}/backend"

        - name: Push backend to Pi (Acts as our change detector)
          synchronize:
            src: "{{ playbook_dir }}/backend/"
            dest: "{{ base_dest }}/backend/"
            delete: yes
            owner: no
            group: no
            rsync_opts:
              - "--exclude=node_modules"
          register: backend_sync

        - name: Pi Build
          when: backend_sync.changed
          shell: "npm install"
          args:
            chdir: "{{ base_dest }}/backend"
          environment:
            PATH: "{{ nvm_bin_dir }}:/usr/bin:/bin"
          become_user: "{{ app_user }}"

        - name: Fix ownership
          when: backend_sync.changed
          file:
            path: "{{ base_dest }}/backend"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: yes

    - name: Notifier Deployment Group
      block:
        - name: Sync notifier files directly to Pi
          synchronize:
            src: "{{ playbook_dir }}/notifier/"
            dest: "{{ base_dest }}/notifier/"
            delete: yes
            owner: no
            group: no
          register: notifier_sync

        - name: Create Python venv
          when: notifier_sync.changed
          command: python3 -m venv .venv
          args:
            chdir: "{{ base_dest }}/notifier"
            creates: "{{ base_dest }}/notifier/.venv"

        - name: Make alert scripts executable
          when: notifier_sync.changed
          file:
            path: "{{ base_dest }}/notifier/{{ item }}"
            mode: "+x"
          loop:
            - notify.py
            - temp.notify.py
          ignore_errors: true

        - name: Fix ownership
          when: notifier_sync.changed
          file:
            path: "{{ base_dest }}/notifier"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: yes

    - name: Frontend Deployment Group
      block:
        - name: Download master .env from Pi for local build
          fetch:
            src: "{{ master_env }}"
            dest: "{{ playbook_dir }}/frontend/.env"
            flat: yes

        - name: Local Build - Compile Frontend
          delegate_to: localhost
          become: no
          shell: "source ~/.nvm/nvm.sh && npm install && npm run build"
          args:
            executable: /bin/bash
            chdir: "{{ playbook_dir }}/frontend"

        - name: Ensure final dist directory exists on Pi
          file:
            path: "{{ base_dest }}/frontend/dist"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_user }}"

        - name: Push compiled dist to Pi (Acts as our change detector)
          synchronize:
            src: "{{ playbook_dir }}/frontend/dist/"
            dest: "{{ base_dest }}/frontend/dist/"
            delete: yes
            owner: no
            group: no
          register: frontend_sync

        - name: Fix ownership of final dist
          when: frontend_sync.changed
          file:
            path: "{{ base_dest }}/frontend/dist"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: yes

    - name: Systemd Services and Startup Group
      block:
        - name: Copy systemd units
          copy:
            src: "{{ playbook_dir }}/services/{{ item }}"
            dest: "{{ base_dest }}/services/{{ item }}"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
          loop: "{{ systemd_units }}"
          register: service_files_sync

        - name: Link updated units into systemd
          command: systemctl link {{ base_dest }}/services/{{ item.item }}
          loop: "{{ service_files_sync.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.changed
          register: link_result
          changed_when: "'Created symlink' in link_result.stdout"

        - name: Reload systemd daemon if units changed
          systemd:
            daemon_reload: yes
          when: service_files_sync.changed

        - name: Ensure all services are online (Starts if currently down)
          systemd:
            name: "{{ item }}"
            state: started
          loop: "{{ active_services }}"

        - name: Restart External if source code changed
          systemd:
            name: "{{ item }}"
            state: restarted
          loop: "{{ restart_triggers.external }}"
          when: external_sync.changed

        - name: Restart Backend if source code changed
          systemd:
            name: "{{ item }}"
            state: restarted
          loop: "{{ restart_triggers.backend }}"
          when: backend_sync.changed

        - name: Restart Frontend if source code changed
          systemd:
            name: "{{ item }}"
            state: restarted
          loop: "{{ restart_triggers.frontend }}"
          when: frontend_sync.changed

        - name: Restart Notifiers if source code changed
          systemd:
            name: "{{ item }}"
            state: restarted
          loop: "{{ restart_triggers.notifier }}"
          when: notifier_sync.changed

        - name: Restart any service whose .service or .timer file changed
          systemd:
            name: "{{ item.item }}"
            state: restarted
          loop: "{{ service_files_sync.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.changed and item.item in active_services