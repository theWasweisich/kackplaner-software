---
- name: Deploy Kackplaner
  hosts: kiosk
  become: true

  vars:
    app_name: "kackplaner"
    app_user: "user"
    base_dest: "/opt/{{ app_name }}"
    master_env: "/opt/{{ app_name }}.env"

    active_services:
      - "{{ app_name }}-external.service"
      - "{{ app_name }}-backend.service"
      - "{{ app_name }}-frontend.service"
      - "{{ app_name }}-telegram-bot.service"
      - "{{ app_name }}-kiosk-supervisor.service"
      - "{{ app_name }}-alert.timer"
      - "{{ app_name }}-alert-temp.timer"

    systemd_units: "{{ active_services + [app_name + '-alert.service', app_name + '-alert-temp.service'] }}"

    restart_triggers:
      external:
        - "{{ app_name }}-external.service"
      backend:
        - "{{ app_name }}-backend.service"
      frontend:
        - "{{ app_name }}-frontend.service"
      notifier:
        - "{{ app_name }}-telegram-bot.service"
      kiosk_scripts:
        - "{{ app_name }}-kiosk-supervisor.service"

  tasks:
    - name: Prerequisites and Setup Group
      block:
        - name: Verify master config exists
          ansible.builtin.stat:
            path: "{{ master_env }}"
          register: master_env_stat
          failed_when: not master_env_stat.stat.exists

        - name: Resolve NVM path for {{ app_user }}
          ansible.builtin.shell: "source ~/.nvm/nvm.sh && nvm which current"
          args:
            executable: /bin/bash
          become_user: "{{ app_user }}"
          register: nvm_which
          changed_when: false

        - name: Extract NVM binary directory
          ansible.builtin.set_fact:
            nvm_bin_dir: "{{ nvm_which.stdout | dirname }}"

        - name: Set up persistent data directory
          ansible.builtin.file:
            path: "{{ base_dest }}/data"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: "0755"

    - name: External Deployment Group
      block:
        - name: Local Build - Compile TypeScript
          delegate_to: localhost
          become: false
          ansible.builtin.shell: "source ~/.nvm/nvm.sh && npm install && npx tsc"
          args:
            executable: /bin/bash
            chdir: "{{ playbook_dir }}/external"
          # noqa: no-changed-when

        - name: Push external to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/external/"
            dest: "{{ base_dest }}/external/"
            delete: true
            owner: false
            group: false
            checksum: true
            rsync_opts:
              - "--exclude=node_modules"
          register: external_sync

        - name: Pi Build - Install ARM-compatible Node modules
          when: external_sync.changed
          ansible.builtin.command: npm install
          args:
            chdir: "{{ base_dest }}/external"
          environment:
            PATH: "{{ nvm_bin_dir }}:/usr/bin:/bin"
          become_user: "{{ app_user }}"
          # noqa: no-changed-when no-handler

        - name: Fix ownership
          when: external_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/external"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

    - name: Backend Deployment Group
      block:
        - name: Local Build - Compile TypeScript
          delegate_to: localhost
          become: false
          ansible.builtin.shell: "source ~/.nvm/nvm.sh && npm install && npx tsc"
          args:
            executable: /bin/bash
            chdir: "{{ playbook_dir }}/backend"
          # noqa: no-changed-when

        - name: Push backend to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/backend/"
            dest: "{{ base_dest }}/backend/"
            delete: true
            owner: false
            group: false
            checksum: true
            rsync_opts:
              - "--exclude=node_modules"
          register: backend_sync

        - name: Pi Build - Install ARM-compatible Node modules
          when: backend_sync.changed
          ansible.builtin.command: npm install
          args:
            chdir: "{{ base_dest }}/backend"
          environment:
            PATH: "{{ nvm_bin_dir }}:/usr/bin:/bin"
          become_user: "{{ app_user }}"
          # noqa: no-changed-when no-handler

        - name: Fix ownership
          when: backend_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/backend"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

    - name: Notifier Deployment Group
      block:
        - name: Sync notifier files directly to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/notifier/"
            dest: "{{ base_dest }}/notifier/"
            delete: true
            owner: false
            group: false
            checksum: true
          register: notifier_sync

        - name: Create Python venv
          when: notifier_sync.changed
          ansible.builtin.command: python3 -m venv .venv
          args:
            chdir: "{{ base_dest }}/notifier"
            creates: "{{ base_dest }}/notifier/.venv"
          # noqa: no-handler

        - name: Make alert scripts executable
          when: notifier_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/notifier/{{ item }}"
            mode: "0755"
          loop:
            - notify.py
            - temp.notify.py
          failed_when: false
          # noqa: no-handler

        - name: Fix ownership
          when: notifier_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/notifier"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

    - name: Kiosk Scripts Deployment Group
      block:
        - name: Sync kiosk scripts to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/kiosk-scripts/"
            dest: "{{ base_dest }}/kiosk-scripts/"
            delete: true
            owner: false
            group: false
            checksum: true
          register: kiosk_scripts_sync

        - name: Make scripts executable and fix ownership
          when: kiosk_scripts_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/kiosk-scripts"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

    - name: Frontend Deployment Group
      block:
        - name: Download master .env from Pi for local build
          ansible.builtin.fetch:
            src: "{{ master_env }}"
            dest: "{{ playbook_dir }}/frontend/.env"
            flat: true

        - name: Local Build - Compile Frontend
          delegate_to: localhost
          become: false
          ansible.builtin.shell: "source ~/.nvm/nvm.sh && npm install && npm run build"
          args:
            executable: /bin/bash
            chdir: "{{ playbook_dir }}/frontend"
          # noqa: no-changed-when

        - name: Ensure final dist directory exists on Pi
          ansible.builtin.file:
            path: "{{ base_dest }}/frontend/dist"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: "0755"

        - name: Push compiled dist to Pi
          ansible.posix.synchronize:
            src: "{{ playbook_dir }}/frontend/dist/"
            dest: "{{ base_dest }}/frontend/dist/"
            delete: true
            owner: false
            group: false
            checksum: true
          register: frontend_sync

        - name: Fix ownership of final dist
          when: frontend_sync.changed
          ansible.builtin.file:
            path: "{{ base_dest }}/frontend/dist"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            recurse: true
            mode: "0755"
          # noqa: no-handler

    - name: Systemd Services and Startup Group
      block:
        - name: Copy systemd units individually
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/services/{{ item }}"
            dest: "{{ base_dest }}/services/{{ item }}"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: "0644"
          loop: "{{ systemd_units }}"
          register: service_files_sync

        - name: Link updated units into systemd
          ansible.builtin.command: systemctl link {{ base_dest }}/services/{{ item.item }}
          loop: "{{ service_files_sync.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.changed
          register: link_result
          changed_when: "'Created symlink' in link_result.stdout"
          # noqa: command-instead-of-module no-handler

        - name: Reload systemd daemon if units changed
          ansible.builtin.systemd:
            daemon_reload: true
          when: service_files_sync.changed
          # noqa: no-handler

        - name: Ensure all services are online
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: started
          loop: "{{ active_services }}"

        - name: Restart External daemons if source code changed
          ansible.builtin.command: "systemctl restart {{ restart_triggers.external | join(' ') }}"
          when: external_sync.changed
          # noqa: no-handler

        - name: Restart Backend daemons if source code changed
          ansible.builtin.command: "systemctl restart {{ restart_triggers.backend | join(' ') }}"
          when: backend_sync.changed
          # noqa: no-handler

        - name: Restart Frontend daemons if source code changed
          ansible.builtin.command: "systemctl restart {{ restart_triggers.frontend | join(' ') }}"
          when: frontend_sync.changed
          # noqa: no-handler

        - name: Restart Notifier daemons if source code changed
          ansible.builtin.command: "systemctl restart {{ restart_triggers.notifier | join(' ') }}"
          when: notifier_sync.changed
          # noqa: no-handler

        - name: Restart Kiosk Supervisor
          ansible.builtin.command: "systemctl restart {{ restart_triggers.kiosk_scripts | join(' ') }}"
          when: kiosk_scripts_sync.changed
          # noqa: no-handler

        - name: Restart any service whose unit file changed
          ansible.builtin.systemd:
            name: "{{ item.item }}"
            state: restarted
          loop: "{{ service_files_sync.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.changed and item.item in active_services
          # noqa: no-handler
